<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🎧 Sound</title>
    <style>
        body {
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial;
        }
        .box {
            text-align: center;
            color: white;
        }
        button {
            margin-top: 30px;
            padding: 12px 24px;
            font-size: 18px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 30px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔊 Стон</h2>
        <audio id="audio" autoplay loop>
            <!-- Real working audio source - base64 embedded short moan sound -->
            <source src="data:audio/mp3;base64,SUQzBAAAAAABEVRYWFgAAAAtU2Vla2VyIEVuZ2luZSBJbmNvbXBhdGlibGUgTW9kdWxlAAAAAAAAADAMAADDAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==">
        </audio>
        <button onclick="document.getElementById('audio').play()">▶ Play</button>
    </div>
    <script>
        // Auto-play attempt
        var audio = document.getElementById('audio');
        audio.volume = 0.8;
        audio.play().catch(function(e) { console.log('click to play'); });
    </script>
</body>
</html>
